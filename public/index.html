<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ec" />
    <meta name="description" content="A considered way to handle a cancelled class. Turn customer replies into clear rebooking and refund plans with Raincheck." />
    <title>Raincheck — a good way forward</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#workspace">Skip to the workspace</a>
    <header class="site-header">
      <a class="brand" href="./" aria-label="Raincheck home">
        <svg class="brand-mark" viewBox="0 0 42 44" aria-hidden="true"><path d="M4 22a17 17 0 0 1 34 0H4Z" fill="currentColor"/><path d="M21 5v31a5 5 0 0 0 10 0" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="m7 31-2 4m31-6-2 4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        <span>raincheck<span class="brand-period">.</span></span>
      </a>
      <p class="brand-note">A good way forward.</p>
      <nav class="header-actions" aria-label="Workspace tools">
        <a id="batch-link" class="text-button" hidden>Batch preflight</a>
        <button class="text-button help-button" type="button" data-action="about">How it works</button>
        <button class="button button-outline ledger-button" type="button" data-action="ledger">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 3.5h10a1 1 0 0 1 1 1V17l-3-1.5L10 17l-3-1.5L4 17V4.5a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M7 7h6M7 10h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          Outcome ledger
        </button>
      </nav>
    </header>
    <main id="workspace" class="workspace" tabindex="-1" aria-busy="true">
      <div class="loading-state"><span class="loading-umbrella" aria-hidden="true">☂</span><p>Opening the studio desk…</p></div>
    </main>
    <footer class="site-footer">
      <span class="footer-wordmark">For the people behind the tickets.</span>
      <a href="./demo.html">Watch demo ↗</a>
      <span>Built with care. Powered by a clear plan.</span>
    </footer>
    <dialog id="workspace-dialog" class="workspace-dialog" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  </body>
</html>
